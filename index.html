 const m=Math.min(1,Math.hypot(d.ix,d.iz)),sp=d.owner?9.5:8.4;

 else d.v.multiplyScalar(1-Math.min(1,dt*2));

 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const a=ds[i],b=ds[j];if(a.ko>0||b.ko>0)continue;const dx=b.p.x-a.p.x,dz=b.p.z-a.p.z,l=Math.hypot(dx,dz)||.01,mn=a.r+b.r;

   if(l<mn){const nx=dx/l,nz=dz/l;bp.x=d.p.x+nx*mn;bp.z=d.p.z+nz*mn;const rel=(bv.x-d.v.x)*nx+(bv.z-d.v.z)*nz;if(rel<0){bv.x+=nx*(-rel*1.4+2);bv.z+=nz*(-rel*1.4+2)}bv.x+=d.v.x*.4;bv.z+=d.v.z*.4}}
  const s=bv.length();if(s>36)bv.multiplyScalar(36/s)}}
